                control: search
                prefix: material_painting_frame_framing_filling_material_rabbet_
                choices:
                  balsa_wood: 'Balsa wood'
                  evazote: Evazote
                  custom: { type: custom }
                custom_slots: 10
              -
                id: materials_frame_curvature_in_rabbet_7
                title: 'Curvature in rabbet'
                control: single
                prefix: material_painting_frame_framing_curvuture_profiles_present_
