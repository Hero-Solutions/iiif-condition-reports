                  track_slide: 'Track & slide'
                  plain_screw_eye: 'Plain screw eye'
                  hook: 'Picture hanger (hook)'
                  custom: { type: custom }
                custom_slots: 10
            presence:
              present: material_painting_frame_framing_present_frame_present
              absent: material_painting_frame_framing_present_frame_absent
