---
# Directe formulierconfiguratie voor de drie compacte rapporttabs.
# control: search | single | multiple | input | condition | treatment
# single is één deselecteerbare radiogroep; multiple bestaat uit onafhankelijke
# checkboxknoppen. Een gemengde multiple-groep kan met radio_groups bepaalde
# keuzes toch exclusief maken. condition ondersteunt hetzelfde via
# rating_radio_groups. treatment bevat twee aparte radiogroepen.
# prefix wordt voor elke sleutel onder choices, rating en issues geplaatst.
# Een gewone choice is `veld: Label`; `type: detail` leest ook oude _text-data
# en `type: custom` is een vrije keuze. search kan extra vrije plaatsen krijgen.
# condition combineert één rating met een lijst kenmerken of schades.
# treatment gebruikt vaste statusknoppen, een datum en het aantal uren.
parameters:
  report_compact_sections:
    painting:
      materials:
        blocks:
          -
            id: materials-block-0
            title: 'Material type'
            groups:
              -
                id: materials_material_type_support_0
                title: Support
                control: search
                prefix: material_painting_support_
                choices:
                  canvas: Canvas
                  wood: { type: detail, label: Wood }
                  metal: { type: detail, label: Metal }
                  paper: Paper
                  cardboard: Cardboard
                  hardboard: Hardboard
                  marouflage: Marouflage
                  custom: { type: custom }
                custom_slots: 10
              -
                id: materials_material_type_paint_layer_1
                title: 'Paint layer'
                control: search
                custom_slots: 10
              -
                id: materials_material_type_varnish_layer_2
                title: 'Varnish layer'
                control: single
                prefix: material_painting_varnish_layer_present_
                choices:
                  complete: reports.varnish_complete_short
                  local: reports.varnish_local_short
                  absent: Absent
                  unclear: Unclear
          -
            id: materials-block-1
            title: Frame
            groups:
              -
                id: materials_frame_type_of_frame_0
                title: 'Type of frame'
                control: search
                prefix: material_painting_frame_type_
                choices:
                  ornament: 'Ornament frame'
                  tight: 'Tight or modern frame'
                  picture: 'Picture frame'
                  historical: 'Historical frame'
                  recent: 'Modern or recent frame'
                  inner: 'Frame with inner frame'
                  original: 'Original frame'
                  custom: { type: custom }
                custom_slots: 10
              -
                id: materials_frame_material_1
                title: Material
                control: search
                prefix: material_painting_frame_material_
                choices:
                  gypsum: Gypsum
                  wood: Wood
                  metal: Metal
                  custom: { type: custom }
                custom_slots: 10
              -
                id: materials_frame_inner_frame_2
                title: 'Inner frame'
                control: search
                prefix: material_painting_frame_inner_
                choices:
                  paper: Paper
                  cardboard: Cardboard
                  textile: Textile
                  custom: { type: custom }
                custom_slots: 10
              -
                id: materials_frame_painting_fixed_in_frame_with_4
                title: 'Painting fixed in frame with'
                control: search
                prefix: material_painting_frame_framing_fixation_
